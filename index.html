const dateEl = document.getElementById('date');
const resultEl = document.getElementById('result');

DATA.teachers.forEach(t => {
  const o=document.createElement('option'); o.value=t; o.textContent=t; teacherEl.appendChild(o);
});
DATA.dates.forEach(d => {
  const o=document.createElement('option'); o.value=d; o.textContent=new Date(d+"T00:00:00").toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'}); dateEl.appendChild(o);
});

function checkDuty(){
  const teacher=teacherEl.value, date=dateEl.value;
  resultEl.style.display='block';
  if(!teacher || !date){
    resultEl.className='result none';
    resultEl.innerHTML='<h2>Please select your name and exam date.</h2>';
    return;
  }
  const matches=DATA.duties.filter(x=>x.teacher===teacher && x.date===date);
  const niceDate=new Date(date+"T00:00:00").toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});
  if(matches.length){
    resultEl.className='result assigned';
    resultEl.innerHTML='<h2>Duty Assigned</h2>'+
      '<div class="meta"><b>Teacher:</b> '+escapeHtml(teacher)+'</div>'+
      '<div class="meta"><b>Date:</b> '+niceDate+'</div>'+
      '<div class="timing">'+matches.map(x=>escapeHtml(x.timing)).join('<br>')+'</div>'+
      '<div class="note">Room number / centre will be told at the Exam Control Room while signing.</div>';
  } else {
    resultEl.className='result none';
    resultEl.innerHTML='<h2>No Duty Assigned</h2>'+
      '<div class="meta"><b>Teacher:</b> '+escapeHtml(teacher)+'</div>'+
      '<div class="meta"><b>Date:</b> '+niceDate+'</div>';
  }
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
